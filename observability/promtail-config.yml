server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Strip the leading "/" from the container name label
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        target_label: container
      # Promote the Compose service name as a label for easy filtering in Grafana
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - regex:
          expression: '^(?P<level>\w+)\s+(\[[^\]]+\]\s+)?(?P<msg>.+)$'
      - labels:
          level:
